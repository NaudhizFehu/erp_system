# Blue-Green 배포를 위한 Nginx 설정
# upstream을 통해 무중단 전환 지원

# 백엔드 upstream (Blue 환경이 기본)
upstream active-backend {
    server localhost:8991;
}

# 프론트엔드 upstream (Blue 환경이 기본)
upstream active-frontend {
    server localhost:8990;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.fehu.kr fehu.kr;

    # API 요청은 백엔드로 프록시
    location /api/ {
        proxy_pass http://active-backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 프론트엔드는 upstream으로 프록시
    location / {
        proxy_pass http://active-frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}
