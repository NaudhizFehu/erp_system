spring:
  datasource:
    url: jdbc:postgresql://fehu.kr:5432/cursor_erp_system
    driver-class-name: org.postgresql.Driver
    username: cursor_erp_system
    password: cursor_erp_system
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT 설정
jwt:
  secret: test-secret-key-for-jwt-token-generation-and-validation
  expiration: 86400000 # 24시간 (밀리초)
  refresh-expiration: 2592000000 # 30일 (밀리초)

# 로깅 설정
logging:
  level:
    com.erp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
