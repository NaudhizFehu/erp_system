# GitLab CI/CD 파이프라인 설정
# Backend 테스트 자동화

stages:
  - lint
  - test
  - build

# Backend 빌드 및 테스트
backend-test:
  stage: build
  # image 제거 - Shell executor 사용

  # Backend 디렉토리가 변경될 때만 실행
  only:
    changes:
      - backend/**
      - .gitlab-ci.yml

  # Maven 캐시 설정
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.m2/repository

  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/backend/.m2/repository"
    JAVA_HOME: "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_PATH
    CI_SERVER_URL: "https://gitlab.fehu.kr"

  before_script:
    - cd backend
    - export PATH="/opt/homebrew/bin:$PATH"
    - java -version

  script:
    - mvn clean package

  # 테스트 결과를 아티팩트로 저장
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
      - backend/target/*.war
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

  # 태그 제거 - 모든 Runner에서 실행 가능하도록
  # tags:
  #   - docker

# Frontend Lint 검사
frontend-lint:
  stage: lint

  # Frontend 디렉토리가 변경될 때만 실행
  only:
    changes:
      - frontend/**
      - .gitlab-ci.yml

  # npm 캐시 설정
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run lint || true  # 경고는 허용, 에러만 체크
    - npm run type-check
    - npm run format:check || true  # 경고는 허용

# Frontend 테스트
frontend-test:
  stage: test

  # Frontend 디렉토리가 변경될 때만 실행
  only:
    changes:
      - frontend/**
      - .gitlab-ci.yml

  # npm 캐시 설정
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run test -- --run

  # 테스트 결과를 아티팩트로 저장
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

# Frontend 빌드
frontend-build:
  stage: build

  # Frontend 디렉토리가 변경될 때만 실행
  only:
    changes:
      - frontend/**
      - .gitlab-ci.yml

  # npm 캐시 설정
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

  # 빌드 산출물 저장
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
