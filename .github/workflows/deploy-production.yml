name: Deploy to Production

on:
  workflow_dispatch:  # 수동 실행만 허용
    inputs:
      confirm:
        description: '배포를 확인하려면 "deploy"를 입력하세요'
        required: true
        default: ''

jobs:
  # 배포 전 검증
  pre-deployment-checks:
    name: 배포 전 검증
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 배포 확인
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ 배포가 취소되었습니다."
            echo "배포하려면 'deploy'를 입력하세요."
            exit 1
          fi

      - name: 브랜치 확인
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ main 브랜치에서만 배포할 수 있습니다."
            exit 1
          fi

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 프론트엔드 의존성 설치
        run: |
          cd frontend
          npm ci

      - name: 린트 검사
        run: |
          cd frontend
          npm run lint

      - name: 타입 체크
        run: |
          cd frontend
          npm run type-check

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 백엔드 빌드
        run: |
          cd backend
          ./mvnw clean package -DskipTests

  # 수동 승인 대기
  approval:
    name: 배포 승인
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: production
      url: http://your-server.com

    steps:
      - name: 승인 대기
        run: echo "배포 승인 대기 중..."

  # 실제 배포 (SSH 방식)
  deploy:
    name: 운영 서버 배포
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 프론트엔드 빌드
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 백엔드 빌드
        run: |
          cd backend
          ./mvnw clean package -DskipTests

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: 백업 생성
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "if [ -d ${{ secrets.PROD_DIR }} ]; then \
              cp -r ${{ secrets.PROD_DIR }} ${{ secrets.PROD_DIR }}_backup_$(date +%Y%m%d_%H%M%S); \
            fi"

      - name: 파일 업로드
        run: |
          # 디렉토리 생성
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "mkdir -p ${{ secrets.PROD_DIR }}/{frontend,backend}"

          # 프론트엔드 업로드
          rsync -avz --delete \
            frontend/dist/ \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DIR }}/frontend/

          # 백엔드 업로드
          rsync -avz \
            backend/target/*.jar \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DIR }}/backend/

      - name: 서비스 재시작
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            # 백엔드 재시작
            pkill -f 'java.*erp.*jar' || true
            sleep 3
            cd ${{ secrets.PROD_DIR }}/backend
            nohup java -jar *.jar > backend.log 2>&1 &

            # Nginx 재시작
            sudo systemctl reload nginx
          EOF

      - name: Health Check
        run: |
          sleep 30
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "curl -f http://localhost:8080/actuator/health"

      - name: Git 태그 생성
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG="deploy-$(date +%Y.%m.%d-%H%M)"
          git tag -a "$TAG" -m "Production deployment $TAG"
          git push origin "$TAG"

  # 배포 실패 시 알림
  notify-failure:
    name: 배포 실패 알림
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: 실패 알림
        run: |
          echo "❌ 배포 실패!"
          echo "즉시 롤백을 실행하세요."
          # 여기에 Slack, Email 등 알림 로직 추가 가능
